[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-agent-sre"
version = "0.2.0"
description = "SRE for agent fleets: error-budget autonomy, chaos experiments, cross-agent root cause and RUM-style journeys, over plain OpenTelemetry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Debanjan Das"}]
keywords = ["agents", "sre", "slo", "error-budget", "chaos-engineering", "opentelemetry", "observability", "rum"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "opentelemetry-proto>=1.30",
    # the bundled agent world and the gate client emit real OTLP, so the SDK is a core dependency
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "bandit>=1.8", "pip-audit>=2.9"]
ui-test = ["playwright>=1.50"]

[project.scripts]
themis = "themis.cli:main"

[tool.setuptools.packages.find]
include = ["themis*"]

[tool.setuptools.package-data]
themis = ["web/*", "web/fonts/*", "world/*.yaml"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # test data reads better on one line
"scripts/*" = ["E501"]  # so do the video captions
"site/*" = ["E501"]  # and the page copy

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: needs Chrome and playwright", "ecosystem: needs the sibling repos (see tests/test_ecosystem.py)"]
