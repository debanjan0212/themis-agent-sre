apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: themis-slo
  namespace: platform
  labels:
    app.kubernetes.io/name: themis
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: intentops
spec:
  args:
  - name: canary-hash
  metrics:
  - name: error-ratio
    interval: 1m
    failureLimit: 1
    successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= 0.0144
    provider:
      prometheus:
        address: http://kps-prometheus.monitoring:9090
        query: sum(rate(http_server_request_duration_seconds_count{namespace="platform",service="themis",rollouts_pod_template_hash="{{args.canary-hash}}",http_response_status_code=~"5.."}[2m])) / sum(rate(http_server_request_duration_seconds_count{namespace="platform",service="themis",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
  - name: p95-latency-ms
    interval: 1m
    failureLimit: 1
    successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= 300
    provider:
      prometheus:
        address: http://kps-prometheus.monitoring:9090
        query: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{namespace="platform",service="themis",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))) * 1000
