apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: themis
  namespace: platform
  labels:
    app.kubernetes.io/name: themis
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: intentops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: themis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
    ports:
    - port: 8600
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: aegis-war-room
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argus
