apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: themis
  namespace: platform
  labels:
    app.kubernetes.io/name: themis
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: intentops
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: themis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: themis
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/managed-by: intentops
    spec:
      serviceAccountName: themis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: themis
      containers:
      - name: themis
        image: ghcr.io/debanjan0212/themis-agent-sre:0.1.0
        ports:
        - name: http
          containerPort: 8600
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - secretRef:
            name: themis-secrets
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    canary:
      analysis:
        templates:
        - templateName: themis-slo
        startingStep: 1
        args:
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
      steps:
      - setWeight: 10
      - pause:
          duration: 5m
      - setWeight: 50
      - pause:
          duration: 5m
