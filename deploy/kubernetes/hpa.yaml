apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: themis
  namespace: platform
  labels:
    app.kubernetes.io/name: themis
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: intentops
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: themis
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
