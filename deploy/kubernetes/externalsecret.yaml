apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: themis-secrets
  namespace: platform
  labels:
    app.kubernetes.io/name: themis
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: intentops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fake-secrets
  target:
    name: themis-secrets
  data:
  - secretKey: THEMIS_DB_URL
    remoteRef:
      key: platform/themis/themis-db-url
  - secretKey: THEMIS_BOOTSTRAP_KEY
    remoteRef:
      key: platform/themis/themis-bootstrap-key
