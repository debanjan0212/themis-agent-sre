# Security checks for Themis. They run on every push to main, on every pull request and once a
# week, because new advisories appear even when the code does not change.
#
# Every action is pinned to a full commit SHA, not a tag. Tags can be moved; a SHA cannot. Dependabot
# proposes updates to the pins.
#
# The CodeQL job and the "Publish to the Security tab" step need a public repository (or GitHub Advanced
# Security on a private one). On a private repository without it, delete those two parts.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install bandit pip-audit
      - name: Static analysis (medium or worse fails)
        run: bandit -q -ll -r themis
      - name: Known vulnerabilities in the exact versions that ship
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checked against its published checksum
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks && rm gitleaks.tar.gz
      - run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner'

  trivy:
    name: Trivy (dependencies, secrets, Dockerfile and Kubernetes config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the repo's Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan and record
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Publish to the Security tab
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Fail on anything high or critical that has a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  codeql:
    name: CodeQL (Python and the dashboard's JavaScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
