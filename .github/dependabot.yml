# Dependabot opens a pull request when a dependency has an update or a security fix.
# That is the "fix" half of scanning: the scanners find the problem, this proposes the change.
# Its pull requests go to main, like every other change.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # keeps the commit pins in .github/workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
